spring.application.name=donation

# Banco de dados ativo: "postgres" (padrão) ou "mysql".
# Para trocar:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#           ou  SPRING_PROFILES_ACTIVE=mysql
# URL e credenciais podem ser sobrescritas por SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# ou pelo application-secret.properties (ignorado pelo git).
spring.profiles.active=postgres
spring.profiles.include=secret

spring.sql.init.mode=always

# JWT Configuration
jwt.secret=plataforma-doacao-secret-key-super-secreta-uau-omg
jwt.expiration=86400000
