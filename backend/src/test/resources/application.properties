# Test configuration with in-memory H2 so tests run independently of external databases
spring.application.name=donation-test
spring.datasource.url=jdbc:h2:mem:donation_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never

